server:
  port: 8082
  error:
    include-stacktrace: never

spring:
  application:
    name: michelin
  datasource:
    url: jdbc:h2:./michelin;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: root
    password: root
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

app:
  lucene:
    index-path: ./index
